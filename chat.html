<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a4f2b">
<title>OSSIA | Chatbot Edukasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell" id="view-chatbot">
<aside class="sidebar">
<div class="brand">
<div style="background: #ffffff; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--rs-green-dark); font-weight: 800; font-size: 1.2rem; font-family: var(--font-head);">O</div>
<div>OSSIA</div>
</div>
<nav class="nav">
<button onclick="bukaHalaman('home')">🏠 Home (Dashboard)</button>
<button onclick="bukaHalaman('me')">👤 Me (Profil &amp; Riwayat)</button>
<button aria-current="page" onclick="bukaHalaman('chat')">💬 Chatbot Edukasi</button>
</nav>
<div class="sidebar-foot">
<strong>An. Arka</strong>
<span style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 10px;">Pasien Anak</span>
<button class="btn small block" onclick="bukaHalaman('login')" style="background: transparent; border: 1px solid rgba(255,255,255,0.2);">Keluar</button>
</div>
</aside>
<main style="display: flex; flex-direction: column; height: 100vh;">
<!-- Header Ruang Chat (Menampilkan AI) -->
<div class="panel" style="margin-bottom: 1rem; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--line);">
<div style="width: 45px; height: 45px; border-radius: 50%; background: var(--rs-green-dark); display: grid; place-items: center; font-size: 1.5rem; border: 1px solid var(--rs-green);">🤖</div>
<div>
<strong style="font-size: 1.1rem; display: block; color: var(--ink);">AI Asisten OSSIA</strong>
<span style="font-size: 0.85rem; color: var(--rs-green);">● Siap membantu analisis X-ray dan data medis</span>
</div>
</div>
<!-- Kotak Chat Utama -->
<div class="panel" style="flex: 1; display: flex; flex-direction: column; padding: 0; overflow: hidden; background: #fdfdfd;">
<div id="chat-box" style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: var(--box);">
<!-- Chat AI Awal -->
<div style="display: flex; gap: 0.8rem; align-items: flex-end; max-width: 85%;">
<div style="width: 32px; height: 32px; border-radius: 50%; background: var(--rs-green-dark); display: grid; place-items: center; font-size: 0.9rem;">🤖</div>
<div style="background: #e5f5ec; color: var(--rs-green-dark); padding: 12px 16px; border-radius: 16px 16px 16px 4px; font-size: 0.95rem; border: 1px solid #c2e6d3; line-height: 1.5;">
              Halo! Saya Asisten AI cerdas dari OSSIA.<br/>Anda bisa bertanya terkait informasi rekam medis, atau klik tombol 📎 di bawah untuk mengunggah gambar X-ray baru agar saya analisis menggunakan metode Otsu.
            </div>
</div>
</div>
<!-- Kolom Input Teks & Attachment -->
<div style="padding: 1rem 1.5rem; border-top: 1px solid var(--line); background: #ffffff; display: flex; gap: 0.8rem; align-items: center;">
<button class="btn secondary" onclick="simulasiUnggah()" style="border-radius: 50%; width: 45px; height: 45px; padding: 0; display: grid; place-items: center; font-size: 1.2rem;" title="Unggah X-ray">📎</button>
<input id="chat-input" onkeypress="cekEnter(event)" placeholder="Ketik pertanyaan ke AI..." style="flex: 1; padding: 0.8rem 1rem; border: 1px solid var(--line); border-radius: 99px; font-size: 0.95rem; outline: none;" type="text"/>
<button class="btn" onclick="kirimPesan()" style="border-radius: 99px; padding: 0.8rem 1.5rem;">Kirim</button>
</div>
</div>
</main>
</div>


<script>
(function () {
  const map = {
    landing: "landing.html", login: "login.html",
    home: "home.html", dashboard: "home.html",
    riwayat: "riwayat.html", chat: "chat.html",
    chatbot: "chat.html", me: "me.html"
  };
  window.bukaHalaman = function (target) {
    const file = map[target] || "landing.html";
    const inPagesFolder = /\/pages\//i.test(window.location.pathname.replace(/\\/g, "/"));
    window.location.href = inPagesFolder ? file : ("" + file);
  };
  window.showOssiaToast = function (message) {
    let toast = document.getElementById("ossia-global-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "ossia-global-toast";
      toast.className = "toast";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__ossiaToastTimer);
    window.__ossiaToastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
  };
  document.addEventListener("DOMContentLoaded", function () {
    if (/\/pages\/(home|riwayat|chat|me)\.html$/i.test(window.location.pathname.replace(/\\/g, "/"))) {
      const current = window.location.pathname.split("/").pop().replace(".html", "");
      const nav = document.createElement("nav");
      nav.className = "mobile-nav";
      nav.setAttribute("aria-label", "Navigasi utama");
      const items = [
        ["home", "⌂", "Home"],
        ["riwayat", "▤", "Riwayat"],
        ["chat", "▢", "Chat"],
        ["me", "♙", "Me"]
      ];
      nav.innerHTML = items.map(([id, icon, label]) =>
        `<button type="button" class="${current === id ? "active" : ""}" onclick="bukaHalaman('${id}')"><span aria-hidden="true">${icon}</span><span>${label}</span></button>`
      ).join("");
      document.body.appendChild(nav);
    }
  });
})();
</script>


</body>
</html>
