<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a4f2b">
<title>OSSIA | Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<section class="auth-page">
  <button class="back-link" onclick="bukaHalaman('landing')">← Kembali</button>
  <div class="auth-brand"><span class="brand-symbol">O</span><strong>OSSIA</strong></div>
  <div class="login-form-wrap">
<div class="login-card">
<h2>Masuk ke OSSIA</h2>
<p class="sub">Silakan masuk menggunakan No. Rekam Medis Anda.</p>
<div class="field" style="margin-top: 1.5rem;">
<label>No. Rekam Medis</label>
<input placeholder="Masukkan No. RM Anda" type="text"/>
</div>
<div class="field">
<label>Kata Sandi / Tanggal Lahir</label>
<input placeholder="••••••••" type="password"/>
</div>
<button class="btn block" onclick="bukaHalaman('home')" style="margin-top: 1rem;">Masuk</button>
</div>
</div>
</section>


<script>
(function () {
  const map = {
    landing: "landing.html", login: "login.html",
    home: "home.html", dashboard: "home.html",
    riwayat: "riwayat.html", chat: "chat.html",
    chatbot: "chat.html", me: "me.html"
  };
  window.bukaHalaman = function (target) {
    const file = map[target] || "landing.html";
    const inPagesFolder = /\/pages\//i.test(window.location.pathname.replace(/\\/g, "/"));
    window.location.href = inPagesFolder ? file : ("pages/" + file);
  };
  window.showOssiaToast = function (message) {
    let toast = document.getElementById("ossia-global-toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "ossia-global-toast";
      toast.className = "toast";
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__ossiaToastTimer);
    window.__ossiaToastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
  };
  document.addEventListener("DOMContentLoaded", function () {
    if (/\/pages\/(home|riwayat|chat|me)\.html$/i.test(window.location.pathname.replace(/\\/g, "/"))) {
      const current = window.location.pathname.split("/").pop().replace(".html", "");
      const nav = document.createElement("nav");
      nav.className = "mobile-nav";
      nav.setAttribute("aria-label", "Navigasi utama");
      const items = [
        ["home", "⌂", "Home"],
        ["riwayat", "▤", "Riwayat"],
        ["chat", "▢", "Chat"],
        ["me", "♙", "Me"]
      ];
      nav.innerHTML = items.map(([id, icon, label]) =>
        `<button type="button" class="${current === id ? "active" : ""}" onclick="bukaHalaman('${id}')"><span aria-hidden="true">${icon}</span><span>${label}</span></button>`
      ).join("");
      document.body.appendChild(nav);
    }
  });
})();
</script>


</body>
</html>
