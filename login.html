<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a4f2b">
<title>OSSIA | Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="auth-page">
  <button class="back-link" onclick="bukaHalaman('landing')">← Kembali</button>
  <div class="auth-brand"><span class="brand-symbol">O</span><strong>OSSIA</strong></div>
  <div class="login-form-wrap">
<div class="login-card">
<h2>Masuk ke OSSIA</h2>
<p class="sub">Silakan masuk menggunakan No. Rekam Medis Anda.</p>
<div class="field" style="margin-top: 1.5rem;">
<label>No. Rekam Medis</label>
<input placeholder="Masukkan No. RM Anda" type="text"/>
</div>
<div class="field">
<label>Kata Sandi / Tanggal Lahir</label>
<input placeholder="••••••••" type="password"/>
</div>
<button class="btn block" onclick="bukaHalaman('home')" style="margin-top: 1rem;">Masuk</button>
</div>
</div>
</section>




</body>
</html>
