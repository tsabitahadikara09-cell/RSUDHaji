<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#07543b">

  <title>OSSIA | Skrining Usia Tulang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(
        ellipse at center,
        #f7faf8 0%,
        #e7efea 100%
      );
    }

    /* Frame aplikasi utama */
    #ossiaAppShell {
      display: flex;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: radial-gradient(
        ellipse at center,
        #f7faf8 0%,
        #e7efea 100%
      );
    }

    #ossiaPhoneFrame {
      position: relative;
      width: min(100%, 430px);
      height: min(850px, calc(100dvh - 24px));
      min-height: 520px;
      overflow: hidden;
      border: 1px solid #d7e5dc;
      border-radius: 38px;
      background: #f4f8f5;

      box-shadow:
        0 20px 60px rgba(13, 70, 42, .16);
    }

    #ossiaPageFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f8f5;
    }

    /* Navigasi bawah */
    #ossiaIndexNav {
      display: none;
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;

      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 2px;
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom));

      border: 0;
      border-top: 1px solid #e5eee8;
      border-radius: 0;
      background: #ffffff;
      box-shadow: none;
    }

    #ossiaIndexNav a {
      display: flex;
      min-width: 0;
      min-height: 54px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;

      border-radius: 12px;
      color: #829188;
      text-decoration: none;

      font: 500 11px/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    #ossiaIndexNav a.active {
      color: #087b45;
      background: #edf7f1;
      font-weight: 700;
    }

    #ossiaIndexNav svg {
      display: block;
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-height: 600px) {
      #ossiaPhoneFrame {
        height: calc(100dvh - 12px);
        min-height: 0;
        border-radius: 26px;
      }
    }

    @media (max-width: 460px) {
      #ossiaAppShell {
        padding: 0;
      }

      #ossiaPhoneFrame {
        width: 100%;
        height: 100dvh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #ossiaIndexNav {
        left: 6px;
        right: 6px;
        bottom: calc(6px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

<body>

  <!--
    Landing page diambil langsung dari landing.html.
    Dengan begitu, desain landing di index dan landing
    tidak perlu dibuat dua kali.
  -->

  <section id="ossiaAppShell" aria-label="Aplikasi OSSIA">

    <div id="ossiaPhoneFrame">

      <iframe
        id="ossiaPageFrame"
        title="Halaman OSSIA"
        src="landing.html"
      ></iframe>

      <!-- Navigasi aplikasi -->
      <nav
        id="ossiaIndexNav"
        aria-label="Navigasi utama OSSIA"
      >

        <a href="home.html" data-page="home.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 10.5 12 3.8l8.5 6.7"/>
            <path d="M5.8 9.7v10h12.4v-10"/>
            <path d="M9.5 19.7v-6h5v6"/>
          </svg>
          <span>Home</span>
        </a>

        <a href="riwayat.html" data-page="riwayat.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.8h12a1.5 1.5 0 0 1 1.5 1.5v15H4.5v-15A1.5 1.5 0 0 1 6 3.8Z"/>
            <path d="M8 8h8M8 12h8M8 16h8"/>
          </svg>
          <span>Riwayat</span>
        </a>

        <a href="chat.html" data-page="chat.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 11.2a7.7 7.7 0 0 1-8 7.4 8.8 8.8 0 0 1-3.4-.7l-4.3 1.4 1.4-3.7a7.1 7.1 0 0 1-1.7-4.4 7.8 7.8 0 0 1 8-7.4 7.8 7.8 0 0 1 8 7.4Z"/>
          </svg>
          <span>Chat</span>
        </a>

        <a href="me.html" data-page="me.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7.5" r="3.5"/>
            <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/>
          </svg>
          <span>Me</span>
        </a>

      </nav>

    </div>
  </section>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("ossiaPageFrame");
      const nav = document.getElementById("ossiaIndexNav");

      if (!frame || !nav) return;

      const appPages = [
        "home.html",
        "riwayat.html",
        "chat.html",
        "me.html"
      ];

      /*
       * Fungsi ini bisa dipanggil dari landing.js
       * yang berjalan di dalam iframe landing.html.
       */
      window.openOssiaPage = function (page) {
        if (!page) return;

        nav.style.display = "none";
        frame.src = page;
      };

      function getCurrentFile() {
        try {
          return new URL(
            frame.contentWindow.location.href
          ).pathname.split("/").pop().toLowerCase();
        } catch (error) {
          return new URL(
            frame.src,
            window.location.href
          ).pathname.split("/").pop().toLowerCase();
        }
      }

      function updateNavigation() {
        const currentFile = getCurrentFile();
        const isAppPage = appPages.includes(currentFile);

        nav.style.display = isAppPage ? "grid" : "none";

        nav.querySelectorAll("a[data-page]").forEach((link) => {
          const active =
            link.dataset.page.toLowerCase() === currentFile;

          link.classList.toggle("active", active);

          if (active) {
            link.setAttribute("aria-current", "page");
          } else {
            link.removeAttribute("aria-current");
          }
        });
      }

      frame.addEventListener("load", updateNavigation);

      nav.querySelectorAll("a[data-page]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          window.openOssiaPage(link.dataset.page);
        });
      });
    })();
  </script>

</body>
</html>
